<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Agenda de Treinamentos - Zubale</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
  <!-- HEADER STICKY -->
  <header class="main-header" role="banner">
    <a href="index.html#" class="logo" aria-label="Ir para início">
      <img src="images/zubale.png" alt="Zubale Logo" />
    </a>
    <h1>Agenda de Treinamentos - Zubale</h1>
  </header>

  <main>
    <div class="controls" role="region" aria-label="Controles de filtro e ações">
      <div class="filter-container">
        <label for="lojaFilter" class="label"></label>
        <select id="lojaFilter" aria-label="Filtros:">
          <option value="Todas">Todas</option>
        </select>

        <!-- Checkbox filter container (dinâmico) -->
        <button id="filtersToggle" class="filters-toggle" aria-expanded="false" aria-controls="checkboxFilters">Filtrar ▾</button>
        <div id="checkboxFilters" class="checkbox-filters" aria-hidden="true"></div>
      </div>

      <div class="buttons">
        <button id="btnLocalize" title="Encontrar loja mais próxima">📍 Me Localize</button>
        <button id="btnClearCache" title="Limpar cache local">🗑️ Limpar busca</button>
      </div>
    </div>

    <div id="feedback" class="feedback" role="status">Carregando dados…</div>

    <section id="container" class="container" aria-live="polite"></section>
  </main>

    <!-- POPUP BLACK FRIDAY -->
  <div id="blackFridayPopup" class="black_friday-popup" role="dialog" aria-modal="true" aria-labelledby="blackFridayTitle">
    <div class="black_friday-content">
      <picture>
        <img class="black_friday-img" src="images/Aceite.png" alt="Black Friday Zubale" />
      </picture>
      <button class="black_friday-btn" id="blackFridayBtn" type="button">Clique aqui para continuar no Site</button>
    </div>
  </div>
</div>

  <script defer src="script.js"></script>
  <script>fetch('/api/track?page=k');</script>



</body>
</html>
